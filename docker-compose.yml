---
# =============================================================================
# Fikra Digital — Environnement de développement LOCAL (PC, Docker Desktop)
#
# Rien à voir avec le VPS : base jetable, mot de passe trivial, aucun HTTPS.
# Ne jamais utiliser cette configuration en production.
#
# Démarrer :  docker compose up -d
# Logs     :  docker compose logs -f odoo
# Arrêter  :  docker compose down
# Repartir de zéro : docker compose down -v
#
# Odoo est ensuite sur http://localhost:8069
# =============================================================================

services:
  db:
    image: postgres:16.9
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  odoo:
    image: odoo:18.0
    depends_on:
      db: {condition: service_healthy}
    ports:
      - "8069:8069"
    volumes:
      - odoo-data:/var/lib/odoo
      # Ton code : modifié sur le PC, vu instantanément par Odoo
      - ./addons:/mnt/extra-addons
      - ./config/odoo.conf:/etc/odoo/odoo.conf:ro
    # --dev=all : recharge le XML et les assets sans redémarrer.
    # C'est ce qui rend le développement de snippets supportable.
    command: >
      odoo
      --dev=all
      --db-filter=^dev$$

volumes:
  db-data:
  odoo-data:
